packages:
  - "apps/*"
  - "packages/*"
  - "tooling/*"

overrides:
  bullmq: "6.4.2"
  react: "19.3.1"
  react-dom: "19.3.1"
  # Expo 58 + React Native 0.88.0 (keep @react-native/* on the same line).
  "@react-native/asset-utils": "0.88.0"
  "@react-native/babel-plugin-codegen": "0.88.0"
  "@react-native/codegen": "0.88.0"
  "@react-native/community-cli-plugin": "0.88.0"
  "@react-native/debugger-frontend": "0.88.0"
  "@react-native/debugger-shell": "0.88.0"
  "@react-native/dev-middleware": "0.88.0"
  "@react-native/gradle-plugin": "0.88.0"
  "@react-native/js-polyfills": "0.88.0"
  "@react-native/normalize-colors": "0.88.0"
  "@react-native/virtualized-lists": "0.88.0"
  # GHSA-ggr8-5vv4-36mx: Prisma 7.10 pins deepmerge-ts 7.1.5. v8 fixes the advisory.
  deepmerge-ts: "8.0.2"
  # GHSA-cqhc-2h57-wpxf, GHSA-42r5-vhpq-m858, GHSA-g5xc-5w98-jfvm, GHSA-cx2f-j9fh-8g68
  mariadb: "3.5.4"
  # GHSA-3f6p-5ww8-9rcr, GHSA-rgwj-5xj2-c3m3: Prisma 7.10 pins mysql2 3.15.3.
  mysql2: "3.24.6"
  # One pg so bullmq's optional peer matches @bull-board (two copies break Queue types).
  pg: "8.23.1"
  # GHSA-68fv-2mgg-jv7q / CVE-2026-93749: indexed source-map offset DoS. Patched in 1.2.2.
  source-map-js: "1.2.2"
  # GHSA-pqg4-j6r4-53mv / CVE-2026-102422: quote() injection after a comment token. Patched in 1.11.0; 1.12.0 is current stable.
  shell-quote: "1.12.0"
  # GHSA-587h-7wmj-h5pm, GHSA-698v-4r3x-3vcv, GHSA-r825-w8mm-5pxw: Vite launch-editor Windows injection. Patched in 2.14.2.
  launch-editor: "2.14.2"
  # GHSA-27r3-jxmh-p828: Express body-parser 2.3.0 DoS via trailing bytes after a compressed body. Patched in 2.4.0.
  body-parser: "2.4.0"
  # GHSA-xjj6-f33q-929c, GHSA-4qv8-2p9j-2685, GHSA-f72v-6w45-q472: Electron @electron/get pulls undici 7.30.0. Patched in 7.30.1 (not undici 8).
  undici: "7.30.1"
  # GHSA-w74x-v6f9-j3xg, GHSA-wjr9-j795-jxcr, GHSA-xhq7-xmqj-769h, GHSA-333x-w4r6-6crp: Fastify pulls both 3.x (ajv) and 4.x (fast-json-stringify).
  "fast-uri@3": "3.1.9"
  "fast-uri@4": "4.2.3"

allowBuilds:
  argon2: true
  better-sqlite3: true
  electron: true
  esbuild: true
  prisma: true
  "@prisma/engines": true
  "@prisma/client": true
  msgpackr-extract: true

# uuid@7 is pulled by xcode (Expo config plugins) and has no patched 7.x release.
# GHSA-w5hq-g745-h8pq is fixed from uuid 11.1.1, which is ESM-only and breaks xcode's CJS require.
# node-forge <=1.4.0 (GHSA-86w9-cpqp-85rv / CVE-2026-85393): npm latest is still 1.4.0.
# Expo CLI uses it for code-signing certificates. Kit JWT and crypto do not import node-forge.
# braces <=3.0.3 (GHSA-vfj7-8cjw-p6xm / CVE-2026-93687): no patched release.
# Metro's file map uses it while bundling the Expo app. The API does not pass request input to braces.
# GHSA-mrhx-c7xc-m3w5 (zod <4.6.6 memory exhaustion): kit HTTP surface is zod 4.6.7. Expo CLI still requires zod 3; no patched 3.x. Do not override zod 3 → 4 (breaks Expo CLI).
auditConfig:
  ignoreGhsas:
    - GHSA-w5hq-g745-h8pq
    - GHSA-86w9-cpqp-85rv
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-mrhx-c7xc-m3w5

