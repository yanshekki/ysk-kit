name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - run: pnpm lint
      - run: pnpm check:links
      - run: pnpm audit --audit-level=low
      - run: pnpm layers
      - run: pnpm ysk-kit check agent
      - run: pnpm typecheck
      - run: pnpm test

  thin-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @ysk-kit/create-app start /tmp/ysk-thin-smoke --preset thin --flavor saas --no-admin --no-mobile --db sqlite
      - name: verify thin dest
        working-directory: /tmp/ysk-thin-smoke
        run: |
          test -f AGENTS.md
          test -f .agents/skills/plan-feature/SKILL.md
          test -f .agents/skills/test-plan/SKILL.md
          test -f .agents/skills/write-tests/SKILL.md
          test -f .agents/skills/ui-design/SKILL.md
          test -f .agents/skills/ui-review/SKILL.md
          test -f docs/plans/_template.md
          grep -q '## Current state and reuse' docs/plans/_template.md
          grep -q '## Assumptions' docs/plans/_template.md
          grep -q '## Options considered' docs/plans/_template.md
          test -f .github/copilot-instructions.md
          test -f .gemini/settings.json
          test -f .cursor/rules/tests.mdc
          test -f .cursor/rules/ui.mdc
          grep -q AGENTS.md CLAUDE.md
          pnpm install
          cp .env.example .env
          pnpm db:generate
          pnpm layers
          pnpm ysk-kit check agent
          pnpm typecheck
          pnpm test
          pnpm gen:openapi

  flavor-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        flavor:
          - saas
          - desktop
          - gateway
          - php-bridge
          - trading
          - static-web3
        preset:
          - thin
          - full
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('apps/desktop/package.json') }}
      - run: pnpm install
      - name: smoke ${{ matrix.flavor }} ${{ matrix.preset }}
        run: bash .github/scripts/flavor-smoke.sh ${{ matrix.flavor }} ${{ matrix.preset }}

  example-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        slug:
          - clinic-booking
          - crm-contacts
          - inventory-stock
          - helpdesk-tickets
          - membership-club
          - course-enrollment
          - invoice-quotes
          - event-rsvp
          - job-board
          - field-work-orders
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - name: apply ${{ matrix.slug }}
        run: pnpm --filter @ysk-kit/examples start apply ${{ matrix.slug }} --dest /tmp/ysk-example --yes --force

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ysk
          MYSQL_DATABASE: ysk_kit
          MYSQL_USER: ysk
          MYSQL_PASSWORD: ysk
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      NODE_ENV: development
      API_PORT: "3001"
      API_PUBLIC_URL: http://localhost:3001
      WEB_PUBLIC_URL: http://localhost:5173
      ADMIN_PUBLIC_URL: http://localhost:5174
      DATABASE_URL: mysql://ysk:ysk@127.0.0.1:3306/ysk_kit
      JWT_SECRET: ci-e2e-jwt-secret
      REDIS_URL: ""
      RUN_WORKERS: "0"
      RATE_LIMIT_MAX: "0"
      SEED_ADMIN_EMAIL: admin@ysk.hk
      SEED_ADMIN_PASSWORD: ysk-admin-dev
      SEED_USER_EMAIL: user@ysk.hk
      SEED_USER_PASSWORD: ysk-user-dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - name: write env
        run: |
          printf '%s\n' \
            'NODE_ENV=development' \
            'API_PORT=3001' \
            'API_PUBLIC_URL=http://localhost:3001' \
            'WEB_PUBLIC_URL=http://localhost:5173' \
            'ADMIN_PUBLIC_URL=http://localhost:5174' \
            'DATABASE_URL=mysql://ysk:ysk@127.0.0.1:3306/ysk_kit' \
            'JWT_SECRET=ci-e2e-jwt-secret' \
            'REDIS_URL=' \
            'RUN_WORKERS=0' \
            'RATE_LIMIT_MAX=0' \
            'SEED_ADMIN_EMAIL=admin@ysk.hk' \
            'SEED_ADMIN_PASSWORD=ysk-admin-dev' \
            'SEED_USER_EMAIL=user@ysk.hk' \
            'SEED_USER_PASSWORD=ysk-user-dev' \
            > .env
      - run: pnpm db:generate
      - run: pnpm --filter @ysk-kit/api prisma:migrate:deploy
      - run: pnpm db:seed
      - run: pnpm --filter @ysk-kit/web build
      - run: pnpm --filter @ysk-kit/web exec playwright install --with-deps chromium
      - run: pnpm e2e
