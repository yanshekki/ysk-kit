name: Release

on:
  push:
    branches: [main]
  # Diagnostic only. Logs whether OIDC is available, the target registry, and
  # `npm view` for every public package. It does not publish.
  workflow_dispatch:

# Default deny. The release job raises only what Changesets and npm provenance need.
permissions:
  contents: read

jobs:
  release:
    if: vars.NPM_PUBLISH == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          # No registry-url and no scope. Those inputs make setup-node write an
          # `_authToken` line into ~/.npmrc, and that line overrides npm Trusted Publishing.
      - run: pnpm install
      - id: unpublished
        if: github.event_name == 'push'
        run: node .github/unpublished-packages.mjs
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        if: github.event_name == 'push' && steps.unpublished.outputs.skip != 'true'
        with:
          version-script: pnpm version:packages
          publish-script: pnpm release:publish
          pr-title: 'chore: version packages'
          create-github-releases: false
          # `pnpm release:publish` does not create per-package tags.
          push-git-tags: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # pnpm 12 publishes natively and does not read this as `--provenance`.
          # The publish script passes `--provenance` itself. Kept so an npm
          # subprocess still requests an attestation.
          NPM_CONFIG_PROVENANCE: "true"
      - name: Log publish auth and registry
        if: github.event_name == 'workflow_dispatch'
        run: node .github/publish-packages.mjs --debug
      # Do not key off changesets/action `published`. Custom
      # `pnpm release:publish` stdout is not Changesets' tag format, so that
      # output stays false after a real publish.
      # Skip when unpublished-packages already decided there is nothing to
      # publish (avoids backfilling a missing historical tag). Skip when
      # changesets/action opened or updated a version PR (`hasChangesets`).
      # After that action the workspace sits on `changeset-release/main`
      # with bumped versions and deleted changesets; tag-and-release.mjs
      # still reads versions and pending files at GITHUB_SHA.
      # Real publish path: version PR merged, packages published, no pending
      # changesets at GITHUB_SHA, every name@version installable → annotated
      # vX.Y.Z at GITHUB_SHA plus a GitHub Release from that version's
      # CHANGELOG.md, then pack-and-run --registry.
      - id: tag
        name: Tag vX.Y.Z and GitHub Release
        if: github.event_name == 'push' && steps.unpublished.outputs.skip != 'true' && steps.changesets.outputs.hasChangesets != 'true'
        run: node .github/tag-and-release.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify published packages are installable
        if: github.event_name == 'push' && steps.unpublished.outputs.skip != 'true' && steps.tag.outputs.published == 'true'
        run: node .github/pack-and-run.mjs --registry
