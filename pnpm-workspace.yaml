packages:
  - "apps/*"
  - "packages/*"
  - "tooling/*"

overrides:
  bullmq: "6.3.11"
  react: "19.2.8"
  react-dom: "19.2.8"
  # GHSA-ggr8-5vv4-36mx: Prisma 7.10 pins deepmerge-ts 7.1.5. v8 fixes the advisory.
  deepmerge-ts: "8.0.2"
  # GHSA-cqhc-2h57-wpxf, GHSA-42r5-vhpq-m858, GHSA-g5xc-5w98-jfvm
  mariadb: "3.4.7"
  # GHSA-3f6p-5ww8-9rcr, GHSA-rgwj-5xj2-c3m3: Prisma 7.10 pins mysql2 3.15.3.
  mysql2: "3.24.5"
  # One pg so bullmq's optional peer matches @bull-board (two copies break Queue types).
  pg: "8.23.1"
  # GHSA-68fv-2mgg-jv7q / CVE-2026-93749: indexed source-map offset DoS. Patched in 1.2.2.
  source-map-js: "1.2.2"
  # GHSA-pqg4-j6r4-53mv / CVE-2026-102422: quote() injection after a comment token. Patched in 1.11.0.
  shell-quote: "1.11.0"

allowBuilds:
  argon2: true
  better-sqlite3: true
  electron: true
  esbuild: true
  prisma: true
  "@prisma/engines": true
  "@prisma/client": true
  msgpackr-extract: true

# uuid@7 is pulled by xcode (Expo config plugins) and has no patched 7.x release.
# GHSA-w5hq-g745-h8pq is fixed from uuid 11.1.1, which is ESM-only and breaks xcode's CJS require.
# node-forge <=1.4.0 (GHSA-86w9-cpqp-85rv / CVE-2026-85393): npm latest is still 1.4.0.
# Expo CLI uses it for code-signing certificates. Kit JWT and crypto do not import node-forge.
# braces <=3.0.3 (GHSA-vfj7-8cjw-p6xm / CVE-2026-93687): no patched release.
# Metro's file map uses it while bundling the Expo app. The API does not pass request input to braces.
auditConfig:
  ignoreGhsas:
    - GHSA-w5hq-g745-h8pq
    - GHSA-86w9-cpqp-85rv
    - GHSA-vfj7-8cjw-p6xm

minimumReleaseAgeExclude:
  - "@aws-sdk/client-s3@3.1146.0"
  - "@aws-sdk/s3-request-presigner@3.1146.0"
  - "@biomejs/biome@2.5.15"
  - "@biomejs/cli-darwin-arm64@2.5.15"
  - "@biomejs/cli-darwin-x64@2.5.15"
  - "@biomejs/cli-linux-arm64-musl@2.5.15"
  - "@biomejs/cli-linux-arm64@2.5.15"
  - "@biomejs/cli-linux-x64-musl@2.5.15"
  - "@biomejs/cli-linux-x64@2.5.15"
  - "@biomejs/cli-win32-arm64@2.5.15"
  - "@biomejs/cli-win32-x64@2.5.15"
  - "@tanstack/react-router@1.170.41"
  - "@tanstack/router-core@1.171.34"
  - "@turbo/darwin-64@2.11.7"
  - "@turbo/darwin-arm64@2.11.7"
  - "@turbo/linux-64@2.11.7"
  - "@turbo/linux-arm64@2.11.7"
  - "@turbo/windows-64@2.11.7"
  - "@turbo/windows-arm64@2.11.7"
  - bullmq@6.3.11
  - dependency-cruiser@18.5.0
  - pg-cloudflare@1.4.1
  - pg-connection-string@2.14.1
  - pg-protocol@1.16.1
  - pg@8.23.1
  - turbo@2.11.7
  - vite@8.3.2
  - source-map-js@1.2.2
