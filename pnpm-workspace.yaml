packages:
  - "apps/*"
  - "packages/*"
  - "tooling/*"

overrides:
  bullmq: "6.7.2"
  react: "19.3.1"
  react-dom: "19.3.1"
  # Expo 58 + React Native 0.88.1 (keep @react-native/* on the same line).
  "@react-native/asset-utils": "0.88.1"
  "@react-native/babel-plugin-codegen": "0.88.1"
  "@react-native/codegen": "0.88.1"
  "@react-native/community-cli-plugin": "0.88.1"
  "@react-native/debugger-frontend": "0.88.1"
  "@react-native/debugger-shell": "0.88.1"
  "@react-native/dev-middleware": "0.88.1"
  "@react-native/gradle-plugin": "0.88.1"
  "@react-native/js-polyfills": "0.88.1"
  "@react-native/normalize-colors": "0.88.1"
  "@react-native/virtualized-lists": "0.88.1"
  # GHSA-ggr8-5vv4-36mx: Prisma 7.10 pins deepmerge-ts 7.1.5. v8 fixes the advisory.
  deepmerge-ts: "8.0.2"
  # GHSA-cqhc-2h57-wpxf, GHSA-42r5-vhpq-m858, GHSA-g5xc-5w98-jfvm, GHSA-cx2f-j9fh-8g68
  mariadb: "3.5.5"
  # GHSA-3f6p-5ww8-9rcr, GHSA-rgwj-5xj2-c3m3: Prisma 7.10 pins mysql2 3.15.3.
  mysql2: "3.24.6"
  # One pg so bullmq's optional peer matches @bull-board (two copies break Queue types).
  pg: "8.23.1"
  # GHSA-68fv-2mgg-jv7q / CVE-2026-93749: indexed source-map offset DoS. Patched in 1.2.2.
  source-map-js: "1.2.2"
  # GHSA-pqg4-j6r4-53mv / CVE-2026-102422: quote() injection after a comment token. Patched in 1.11.0; 1.12.0 is current stable.
  shell-quote: "1.12.0"
  # GHSA-587h-7wmj-h5pm, GHSA-698v-4r3x-3vcv, GHSA-r825-w8mm-5pxw: Vite launch-editor Windows injection. Patched in 2.14.2.
  launch-editor: "2.14.2"
  # GHSA-27r3-jxmh-p828: Express body-parser 2.3.0 DoS via trailing bytes after a compressed body. Patched in 2.4.0.
  body-parser: "2.4.0"
  # GHSA-xjj6-f33q-929c, GHSA-4qv8-2p9j-2685, GHSA-f72v-6w45-q472: Electron @electron/get pulls undici 7.30.0. Patched in 7.30.1; 7.30.2 is current 7.x (not undici 8).
  undici: "7.30.2"
  # GHSA-f86p-h4j2-7qgj, GHSA-9wx9-5pv9-3349, GHSA-97r2-qh9m-474h, GHSA-wp97-x4hv-qvhp, GHSA-7rv5-mrxv-xcr9:
  # TanStack Router pulls seroval 1.6.7. Patched in 1.6.11. Stay on 1.6 (1.7 is a later minor).
  seroval: "1.6.12"
  # GHSA-6pq8-jhm2-2vcw: qs.stringify arrayFormat comma DoS. Patched in 6.16.1; 6.17.1 is current stable 6.x.
  qs: "6.17.1"
  # Oct 2026 node-forge PEM/TLS advisories (GHSA-7wch-p9px-956x and siblings). Patched in 1.4.1; 1.4.3 is current.
  node-forge: "1.4.3"
  # GHSA-w74x-v6f9-j3xg, GHSA-wjr9-j795-jxcr, GHSA-xhq7-xmqj-769h, GHSA-333x-w4r6-6crp: Fastify pulls both 3.x (ajv) and 4.x (fast-json-stringify).
  "fast-uri@3": "3.1.9"
  "fast-uri@4": "4.2.3"

allowBuilds:
  argon2: true
  better-sqlite3: true
  electron: true
  esbuild: true
  prisma: true
  "@prisma/engines": true
  "@prisma/client": true
  msgpackr-extract: true

# node-forge 1.4.3: GHSA-86w9-cpqp-85rv no longer reported. Expo CLI still uses node-forge for code-signing certificates; kit JWT and crypto do not import it.
# uuid@7 / GHSA-w5hq-g745-h8pq, zod 3 / GHSA-mrhx-c7xc-m3w5, and deepmerge / GHSA-gcqx-w48m-w2h4 are absent from this week's lockfile.
# braces 3.0.3 is still pulled by micromatch; GHSA-vfj7-8cjw-p6xm is not reported by npm audit this week.
# glob <=14.0.1 (GHSA-3g3m-2fjr-6pw4): patched only in 14.0.2+, which requires minimatch 11 and path-scurry 3.
# Expo CLI still depends on glob 13. No patched 13.x. Do not force glob 14.
# minimatch <11.0.1 (GHSA-g3hv-75wg-m249): no patched 10.x. glob 13 requires minimatch ^10. Do not force minimatch 11.
auditConfig:
  ignoreGhsas:
    - GHSA-3g3m-2fjr-6pw4
    - GHSA-g3hv-75wg-m249

