name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.8.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - run: pnpm lint
      - run: pnpm layers
      - run: pnpm ysk-kit check agent
      - run: pnpm typecheck
      - run: pnpm test

  thin-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.8.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @ysk-kit/create-app start /tmp/ysk-thin-smoke --preset thin --flavor saas --no-admin --no-mobile --db sqlite
      - name: verify thin dest
        working-directory: /tmp/ysk-thin-smoke
        run: |
          pnpm install
          cp .env.example .env
          pnpm db:generate
          pnpm layers
          pnpm ysk-kit check agent
          pnpm typecheck
          pnpm test
          pnpm gen:openapi

  example-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        slug:
          - clinic-booking
          - crm-contacts
          - inventory-stock
          - helpdesk-tickets
          - membership-club
          - course-enrollment
          - invoice-quotes
          - event-rsvp
          - job-board
          - field-work-orders
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.8.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - name: apply ${{ matrix.slug }}
        run: pnpm --filter @ysk-kit/examples start apply ${{ matrix.slug }} --dest /tmp/ysk-example --yes --force

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ysk
          MYSQL_DATABASE: ysk_kit
          MYSQL_USER: ysk
          MYSQL_PASSWORD: ysk
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      NODE_ENV: development
      API_PORT: "3001"
      API_PUBLIC_URL: http://localhost:3001
      WEB_PUBLIC_URL: http://localhost:5173
      ADMIN_PUBLIC_URL: http://localhost:5174
      DATABASE_URL: mysql://ysk:ysk@127.0.0.1:3306/ysk_kit
      JWT_SECRET: ci-e2e-jwt-secret
      REDIS_URL: ""
      RUN_WORKERS: "0"
      RATE_LIMIT_MAX: "0"
      SEED_ADMIN_EMAIL: admin@ysk.hk
      SEED_ADMIN_PASSWORD: ysk-admin-dev
      SEED_USER_EMAIL: user@ysk.hk
      SEED_USER_PASSWORD: ysk-user-dev
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.8.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - name: write env
        run: |
          printf '%s\n' \
            'NODE_ENV=development' \
            'API_PORT=3001' \
            'API_PUBLIC_URL=http://localhost:3001' \
            'WEB_PUBLIC_URL=http://localhost:5173' \
            'ADMIN_PUBLIC_URL=http://localhost:5174' \
            'DATABASE_URL=mysql://ysk:ysk@127.0.0.1:3306/ysk_kit' \
            'JWT_SECRET=ci-e2e-jwt-secret' \
            'REDIS_URL=' \
            'RUN_WORKERS=0' \
            'RATE_LIMIT_MAX=0' \
            'SEED_ADMIN_EMAIL=admin@ysk.hk' \
            'SEED_ADMIN_PASSWORD=ysk-admin-dev' \
            'SEED_USER_EMAIL=user@ysk.hk' \
            'SEED_USER_PASSWORD=ysk-user-dev' \
            > .env
      - run: pnpm db:generate
      - run: pnpm --filter @ysk-kit/api prisma:migrate:deploy
      - run: pnpm db:seed
      - run: pnpm --filter @ysk-kit/web build
      - run: pnpm --filter @ysk-kit/web exec playwright install --with-deps chromium
      - run: pnpm e2e
