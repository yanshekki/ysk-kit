name: Release

on:
  push:
    branches: [main]
  # Diagnostic only. Logs which auth is available, the target registry, and
  # `npm view` for every public package. It does not publish.
  workflow_dispatch:

# Default deny. The release job raises only what Changesets and npm provenance need.
permissions:
  contents: read

jobs:
  release:
    if: vars.NPM_PUBLISH == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
          scope: '@ysk-kit'
      - run: pnpm install
      - id: unpublished
        if: github.event_name == 'push'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node .github/unpublished-packages.mjs
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        if: github.event_name == 'push' && steps.unpublished.outputs.skip != 'true'
        with:
          version-script: pnpm version:packages
          publish-script: pnpm release:publish
          pr-title: 'chore: version packages'
          create-github-releases: false
          # `pnpm release:publish` does not create per-package tags.
          push-git-tags: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # pnpm 12 publishes natively and does not read this as `--provenance`.
          # The publish script passes `--provenance` itself. Kept so an npm
          # subprocess still requests an attestation. NODE_AUTH_TOKEN remains
          # the fallback when the OIDC exchange does not apply.
          NPM_CONFIG_PROVENANCE: "true"
      - name: Log publish auth and registry
        if: github.event_name == 'workflow_dispatch'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node .github/publish-packages.mjs --debug
      # `changeset publish` exits 0 when pnpm's PUT is accepted, before
      # `npm view` can see the version. Fail the job if that stays true.
      - name: Verify packages are installable
        if: github.event_name == 'push' && steps.unpublished.outputs.skip != 'true' && steps.changesets.outcome == 'success'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node .github/publish-packages.mjs --verify-only
