name: Release

on:
  push:
    branches: [main]

# Default deny. The release job raises only what Changesets and npm provenance need.
permissions:
  contents: read

jobs:
  release:
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.8.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
          scope: '@ysk-kit'
      - run: pnpm install
      - id: unpublished
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node .github/unpublished-packages.mjs
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        if: steps.unpublished.outputs.skip != 'true'
        with:
          version-script: pnpm changeset version
          publish-script: pnpm release:publish
          pr-title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # npm treats this as `npm publish --provenance`. @changesets/cli 3.0.3
          # has no --provenance flag; passing one would fail the release.
          # NODE_AUTH_TOKEN keeps the NPM_TOKEN publish path. id-token: write
          # signs the attestation and is what Trusted Publishing uses after the
          # token is removed. See docs/cli/workspace-scripts.md.
          NPM_CONFIG_PROVENANCE: "true"
