[package]
name = "ysk-sidecar"
version = "0.1.0"
edition = "2021"
description = "Process-local ICryptoPort adapter for YSK Kit. Not a public API."
publish = false
license = "MIT"

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
